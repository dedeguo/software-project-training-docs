site_name: 软件开发综合项目实训
site_description: 《软件开发综合项目实训——AI辅助的软件项目开发》电子教程
site_url: https://project-ai.chende.top/
# repo_url: https://github.com/dedeguo/software-project-training-docs
# repo_name: dedeguo/software-project-training-docs

theme:
  name: material
  language: zh
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
nav:
  - 课程介绍: 
     - 课程介绍: index.md
  - 课程导学:
    - 课程导学: guide/index.md
    - 16周项目路线: guide/roadmap.md
    - 学习与AI协作规范: guide/learning-method.md
  - 第一篇｜AI 协同开发实战:
    - 本篇导读：图书管理系统带练: chapter01/index.md
    - 01 认识项目：体验系统与阅读文档: chapter01/01-intro.md
    - 02 准备工具：Trae 与 Superpowers-zh: chapter01/02-ai-tools.md
    - 03 建立规则：Rules、Skills 与 AGENTS.md: chapter01/03-ai-rules.md
    - 04 分步开发：从模板到功能闭环: chapter01/04-development.md
    - 05 测试部署：验证并交付项目: chapter01/05-deployment.md
  - 第二篇｜项目选题与需求分析:
    - 本篇导读：从想法到需求文档: chapter02/index.md
    - 01 选好项目：问题、调研与范围: chapter02/01-topic-research.md
    - 02 项目立项：目标、计划与可行性: chapter02/02-proposal-review.md
    - 03 梳理需求：用户、功能与业务规则: chapter02/03-user-needs.md
    - 04 完成文档：需求说明书与检查: chapter02/04-document-review.md
  - 第三篇｜原型与系统设计:
    - 本篇导读：原型与系统设计: chapter03/index.md
    - 01 明确方案：设计目标、约束与技术选型: chapter03/01-design-selection.md
    - 02 设计架构：系统架构与功能模块: chapter03/02-architecture.md
    - 03 设计原型：UI 原型与页面流程: chapter03/03-prototype.md
    - 04 设计数据：E-R 图与数据表: chapter03/04-database.md
    - 05 完善规则：接口、权限与业务状态: chapter03/05-api-permission-state.md
    - 06 编制文档：系统设计说明书: chapter03/06-design-document.md
    - 07 评审优化：设计检查与迭代改进: chapter03/07-design-review.md
  - 第四篇｜项目开发与业务实现:
    - 本篇导读：从脚手架到完整业务: chapter04/index.md
    - 01 启动项目：选择并运行课程脚手架: chapter04/01-project-scaffold.md
    - 02 改造工程：让脚手架匹配项目设计: chapter04/02-project-customization.md
    - 03 开发基础：登录权限与第一个模块: chapter04/03-first-module.md
    - 04 完成业务：实现核心流程与异常处理: chapter04/04-core-workflow.md
    - 05 增加特色：实现一个有价值的特色功能: chapter04/05-feature.md
    - 06 集成验收：形成完整业务演示版本: chapter04/06-integration-review.md      
  - 第五篇｜测试、部署与成果交付:
    - 本篇导读：从可演示到可交付: chapter05/index.md
    - 01 制定测试：范围、环境与优先级: chapter05/01-test-plan.md
    - 02 执行测试：功能、接口与核心流程: chapter05/02-test-cases.md
    - 03 修复问题：缺陷管理与回归测试: chapter05/03-defect-regression.md
    - 04 部署准备：配置、数据与启动清单: chapter05/04-deployment-preparation.md
    - 05 部署验证：本地 Docker 与可访问系统: chapter05/05-deployment-verification.md
    - 06 整理交付：README、测试报告与 v1.0: chapter05/06-project-delivery.md
  - 扩展篇｜AI 特色功能开发（选学）:
    - 扩展篇导读：先完成基础项目: extension-ai/index.md
    - 01 接入模型：大模型 API 调用: extension-ai/01-llm-api.md
    - 02 改善体验：实现流式问答: extension-ai/02-streaming-chat.md
    - 03 连接知识：构建 RAG 知识库: extension-ai/03-rag-knowledge-base.md
    - 04 融入业务：智能生成、分类与推荐: extension-ai/04-ai-business-features.md
    - 05 拓展能力：Tool Calling、MCP 与智能体: extension-ai/05-tools-mcp-agents.md
    - 06 测试交付：安全、成本、降级与演示: extension-ai/06-testing-delivery.md
  - 第六篇｜项目展示、答辩与成长复盘:
    - 本篇导读：从完成项目到讲清成果: chapter06/index.md
    - 01 准备演示：视频、脚本与环境检查: chapter06/01-demo-preparation.md
    - 02 完成答辩：陈述、PPT 与 Q&A: chapter06/02-defense-presentation.md
    - 03 展示贡献：个人职责与能力证明: chapter06/03-personal-contribution.md
    - 04 整理简历：项目描述与面试表达: chapter06/04-resume-portfolio.md
    - 05 完成复盘：经验总结与后续行动: chapter06/05-project-retrospective.md
  - 项目选题库: projects/index.md
  - 文档与任务模板: doc-templates/index.md
  - 💖 赞赏与支持: about/donate.md 

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

